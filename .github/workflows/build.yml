name: Build Android App (APK & AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew (if present)
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK & Release Bundle (AAB)
        run: |
          gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTesterHub-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: PlayTesterHub-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
