name: Build Android APK & Bundle

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Signing Keystore
        env:
          CUSTOM_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'NnBkgyAhj1sG0FZkLD9x' }}
        run: |
          if [ -n "$CUSTOM_KEYSTORE_BASE64" ]; then
            echo "Using custom keystore from GitHub Secrets (KEYSTORE_BASE64)..."
            echo "$CUSTOM_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
            cp upload-keystore.jks debug.keystore
          elif [ -f upload-keystore.jks ]; then
            echo "Found upload-keystore.jks in repository..."
            cp upload-keystore.jks debug.keystore
          elif [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            echo "Decoding debug.keystore from project base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore..."
            keytool -genkeypair -v -keystore debug.keystore -alias upload -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=Android Debug,O=Android,C=US"
          fi

          TARGET_KS="debug.keystore"
          if [ -f "upload-keystore.jks" ]; then
            TARGET_KS="upload-keystore.jks"
          fi

          DETECTED_ALIAS=$(keytool -list -v -keystore "$TARGET_KS" -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | grep "Alias name:" | head -n 1 | awk '{print $3}' || echo "upload")
          if [ -z "$DETECTED_ALIAS" ]; then
            DETECTED_ALIAS="upload"
          fi
          echo "Detected Keystore Alias: $DETECTED_ALIAS"
          echo "KEY_ALIAS=$DETECTED_ALIAS" >> $GITHUB_ENV

          echo "Exporting public certificate (.pem) for Google Play upload key reset..."
          keytool -exportcert -rfc -keystore "$TARGET_KS" -alias "$DETECTED_ALIAS" -storepass "$KEYSTORE_PASSWORD" -file upload_certificate.pem || true

          echo "Current Signing Certificate SHA-1:"
          keytool -list -v -keystore "$TARGET_KS" -storepass "$KEYSTORE_PASSWORD" | grep "SHA1:" || true

      - name: Setup Google Services Configuration
        env:
          GOOGLE_SERVICES_SECRET: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_SECRET" ]; then
            echo "Writing google-services.json from GitHub Secrets..."
            echo "$GOOGLE_SERVICES_SECRET" > app/google-services.json
          elif [ ! -f app/google-services.json ]; then
            echo "Creating fallback google-services.json for CI build..."
            cat << 'EOF' > app/google-services.json
          {
            "project_info": {
              "project_number": "170455936881",
              "project_id": "playtester-hub-61bd6",
              "storage_bucket": "playtester-hub-61bd6.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:170455936881:android:29bcec6a7e7d0f03c410d0",
                  "android_client_info": {
                    "package_name": "com.playtesterhub.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyDummyKeyForCIBuildConfigOnly12345678"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Android APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'NnBkgyAhj1sG0FZkLD9x' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'NnBkgyAhj1sG0FZkLD9x' }}
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: Build Android App Bundle (AAB for Google Play)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'NnBkgyAhj1sG0FZkLD9x' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'upload' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || 'NnBkgyAhj1sG0FZkLD9x' }}
        run: ./gradlew bundleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Google Play Bundle (AAB)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-aab
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14

      - name: Upload Google Play Key Reset Certificate (.pem)
        uses: actions/upload-artifact@v4
        with:
          name: google-play-upload-certificate
          path: upload_certificate.pem
          retention-days: 14

