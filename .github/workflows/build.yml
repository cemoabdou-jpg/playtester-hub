name: Build Android App (APK & AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Generate upload keystore if not provided
        run: |
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=PlayTesterHub, OU=Dev, O=PlayTester, L=City, S=State, C=US"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Build Debug APK & Release Bundle (AAB)
        env:
          STORE_PASSWORD: "android123"
          KEY_PASSWORD: "android123"
        run: |
          gradle :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTesterHub-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: PlayTesterHub-AAB
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 14
