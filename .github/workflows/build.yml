name: Build Android App (APK & AAB)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK and Build Environment
        run: |
          chmod +x gradlew
          
          # Generate debug.keystore in root directory if not present
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # Generate release keystore in root directory if not present
          if [ ! -f "my-upload-key.jks" ]; then
            keytool -genkeypair -v -keystore my-upload-key.jks \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android123 -keypass android123 \
              -dname "CN=PlayTesterHub, OU=Dev, O=PlayTester, L=City, S=State, C=US"
          fi

      - name: Build Debug APK & Release Bundle (AAB)
        env:
          STORE_PASSWORD: "android123"
          KEY_PASSWORD: "android123"
        run: |
          ./gradlew :app:assembleDebug :app:bundleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTesterHub-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release AAB (Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: PlayTesterHub-AAB
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
